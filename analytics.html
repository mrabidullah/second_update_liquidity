<div class="access-log-footer flex flex-wrap items-center justify-between gap-3 border-t px-5 py-3 text-sm"><b><span id="access-log-total">1,096</span> total</b><nav class="access-log-pagination flex items-center gap-2" aria-label="Access log pagination"><button id="page-first" class="btn !px-3 !py-1.5" type="button" aria-label="First page">&laquo;</button><button id="page-prev" class="btn !px-3 !py-1.5" type="button" aria-label="Previous page">&lsaquo;</button><span id="page-status" class="whitespace-nowrap px-2 text-mut" aria-live="polite">Page 1 of 110</span><button id="page-next" class="btn !px-3 !py-1.5" type="button" aria-label="Next page">&rsaquo;</button><button id="page-last" class="btn !px-3 !py-1.5" type="button" aria-label="Last page">&raquo;</button></nav></div></div></main>

<script>
(function(){
 const people=[
  {first:'Khan',last:'Abid',email:'khan@companya.com',company:'Company A'},
  {first:'Sara',last:'Malik',email:'sara@companyb.com',company:'Company B'},
  {first:'Omar',last:'Siddiqui',email:'omar@elite.com',company:'elite'},
  {first:'Lena',last:'Brandt',email:'lena@companya.com',company:'Company A'},
  {first:'Diego',last:'Alvarez',email:'diego@companyb.com',company:'Company B'},
  {first:'Khan',last:'Abid',email:'khan@elite.com',company:'elite'},
  {first:'Sara',last:'Malik',email:'sara@companya.com',company:'Company A'},
  {first:'Omar',last:'Siddiqui',email:'omar@companyb.com',company:'Company B'},
  {first:'Lena',last:'Brandt',email:'lena@elite.com',company:'elite'},
  {first:'Diego',last:'Alvarez',email:'diego@companya.com',company:'Company A'}
 ];
 const total=1096,pageSize=10,pages=Math.ceil(total/pageSize),rows=document.getElementById('access-log-rows'),cards=document.getElementById('access-log-cards');let page=1;
 const status=document.getElementById('page-status');
 const buttons={first:document.getElementById('page-first'),prev:document.getElementById('page-prev'),next:document.getElementById('page-next'),last:document.getElementById('page-last')};
 function timestamp(index){const d=new Date(Date.UTC(2026,9,6,11,22)-index*7*60000);return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'UTC'}).format(d).replace(',', '');}
 function render(){const start=(page-1)*pageSize,end=Math.min(start+pageSize,total);rows.replaceChildren();cards.replaceChildren();for(let i=start;i<end;i++){const person=people[i%people.length],date=new Date(Date.UTC(2026,9,6,11,22)-i*7*60000),tr=document.createElement('tr');[timestamp(i),person.first,person.last,person.email,person.company].forEach((value,column)=>{const td=document.createElement('td');td.dataset.label=['Date & time','First name','Last name','Email','Company'][column];td.textContent=value;if(column===0)td.className='whitespace-nowrap';if(column===3)td.className='text-mut';tr.appendChild(td);});rows.appendChild(tr);const item=document.createElement('li');item.className='access-log-item';const time=document.createElement('time');time.className='access-log-date';time.dateTime=date.toISOString();time.textContent=timestamp(i);const name=document.createElement('strong');name.className='access-log-person';name.textContent=person.first+' '+person.last;const email=document.createElement('span');email.className='access-log-email';email.textContent=person.email;const company=document.createElement('span');company.className='access-log-company';company.textContent=person.company;item.append(time,name,company,email);cards.appendChild(item);}status.textContent='Page '+page+' of '+pages;buttons.first.disabled=buttons.prev.disabled=page===1;buttons.next.disabled=buttons.last.disabled=page===pages;}
 buttons.first.addEventListener('click',()=>{page=1;render();});buttons.prev.addEventListener('click',()=>{if(page>1){page--;render();}});buttons.next.addEventListener('click',()=>{if(page<pages){page++;render();}});buttons.last.addEventListener('click',()=>{page=pages;render();});render();
})();
</script></body>
