<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Accept invitation | Deltablock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="fixed right-4 top-4 z-10">
    <button type="button" data-theme-toggle class="btn !p-2" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span class="t-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span>
      <span class="t-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
    </button>
  </div>
  <div class="guest-page">
    <a href="login.html" class="guest-brand" aria-label="Deltablock home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1220"/></svg>
      <span>DELTABLOCK</span>
    </a>
    <main class="guest-content">
      <section class="card guest-card">
        <h1 class="text-2xl font-semibold tracking-tight">Accept invitation</h1>
        <p class="mb-6 mt-2 text-sm text-mut">Aisha Khan invited you to Company 1 as a read-only guest. Set your sign-in details to join.</p>
        <form action="dashboard.html">
          <label class="lbl" for="name">Your name</label>
          <input id="name" name="name" class="inp mb-3" value="Jordan Lee" autocomplete="name" required>
          <label class="lbl" for="email">Invited email</label>
          <input id="email" name="email" class="inp mb-3" type="email" value="jordan@example.com" readonly>
          <label class="lbl" for="password">Create password</label>
          <input id="password" name="password" class="inp mb-3" type="password" placeholder="At least 12 characters" autocomplete="new-password" required minlength="12">
          <label class="lbl" for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" class="inp" type="password" autocomplete="new-password" required minlength="12">
          <p class="mt-4 text-xs text-cap">Access includes Company 1 overview, reports, and trade history.</p>
          <button class="btn btn-p mt-4 w-full">Accept invitation</button>
        </form>
        <a href="login.html" class="mt-5 inline-block text-sm text-mut">Back to sign in</a>
      </section>
    </main>
  </div>
</body>
</html>
